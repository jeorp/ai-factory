name: checks
on: [push, pull_request]
jobs:
 backend:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with:
      go-version-file: backend/go.mod
      cache-dependency-path: backend/go.sum
   - run: go test -race ./...
     working-directory: backend
   - run: go vet ./...
     working-directory: backend
 web:
  runs-on: ubuntu-latest
  defaults:
   run:
    working-directory: frontend/web
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 24
      cache: npm
      cache-dependency-path: frontend/web/package-lock.json
   - run: npm ci
   - run: npm test
   - run: npm run build:local
 integration:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with:
      go-version-file: backend/go.mod
      cache-dependency-path: backend/go.sum
   - run: docker compose up --build -d --wait firebase-emulator
   - run: go test -race ./internal/httpapi -run TestEmulator -v
     working-directory: backend
     env:
      RUN_EMULATOR_TESTS: "1"
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9197
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8186
   - if: always()
     run: docker compose down
